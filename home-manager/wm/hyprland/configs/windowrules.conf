windowrule = suppress_event maximize, match:class .*

# Floating windows
windowrule = float on, match:tag floating-window
windowrule = center on, match:tag floating-window
windowrule = size (monitor_w*0.8) (monitor_h*0.8), match:tag floating-window

windowrule = tag +floating-window, match:class (terminal.float|org.gnome.Nautilus|org.gnome.NautilusPreviewer|blueberry.py)
windowrule = tag +floating-window, match:class (xdg-desktop-portal-gtk|sublime_text|DesktopEditors|org.gnome.Nautilus|chromium|code), match:title ^(Open.*Files?|Open [F|f]older.*|Save.*Files?|Save.*As|Save|All Files)

# Fullscreen screensaver
windowrule = fullscreen on, match:class Screensaver

windowrule = workspace 1, match:class (com.mitchellh.ghostty)
windowrule = workspace 2, match:class (code)
windowrule = workspace 3, match:class (chromium-browser)
windowrule = workspace 4, match:class (Slack)
windowrule = workspace 5, match:class (vesktop)
windowrule = workspace 7, match:class (thunderbird)

